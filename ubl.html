    <script>
        (function () {
            const passwordHash = 'c1733b647cba95cbd8cc26b6f7e484b1e5ca8b93e5ecde5bf5ec7c0555742702';
            const sessionKey = 'ubl-best-work-unlocked';
            const dialog = document.getElementById('password-dialog');
            const gallery = document.getElementById('ubl-gallery');
            const form = document.getElementById('password-form');
            const input = document.getElementById('project-password');
            const error = document.getElementById('password-error');

            function unlock(closeDialog) {
                gallery.hidden = false;
                sessionStorage.setItem(sessionKey, 'true');
                if (closeDialog && dialog.open) dialog.close();
            }

            if (sessionStorage.getItem(sessionKey) === 'true') {
                unlock(false);
            } else {
                dialog.showModal();
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input.value));
                const candidate = Array.from(new Uint8Array(digest), function (byte) {
                    return byte.toString(16).padStart(2, '0');
                }).join('');

                if (candidate === passwordHash) {
                    unlock(true);
                    return;
                }

                error.hidden = false;
                input.select();
            });
        }());
    </script>
